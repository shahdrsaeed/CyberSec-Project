{% extends "base.html" %}
{% block content %}

<!-- blind time sqli must display no results and display the same answer regardless of input
    so that time is the only way to be able to gain information -->

<div class="sqli-title-container">
    <div class="sqli-title">BLIND TIME</div>
</div>

<form method="POST" action="{{ url_for('blind_time') }}">
    <input type="hidden" name="chosen_tab" value="{{ chosen_tab }}" />

    <div class="sqli-example-container">
        <div class="sqli-example">
            <input type="text" id="query" name="query" value="{{ query }}" placeholder="Subscribe to our newsletter">
            <button type="submit">Subscribe</button>
        </div>
    </div>

    <div class="tabs">
        {% for tab_name in ["none", "protection 1", "protection 2"] %}
        <button class="tab {{ 'active' if chosen_tab == tab_name else '' }}"
                type="submit"
                name="tab_choice"
                value="{{ tab_name }}">
            {{ tab_name|capitalize }}
        </button>
        {% endfor %}
    </div>
</form>

{% include "dbms_result.html" %}

{% endblock %}
